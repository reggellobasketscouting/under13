<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basket Stats Reggello</title>
    <style>
        :root { --team-green: #2e7d32; --red: #ff4444; --bg: #121212; --card: #1e1e1e; --grey: #333; --modal-bg: rgba(0,0,0,0.98); --yellow: #ffcc00; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; overflow-x: hidden; }
        .container { max-width: 600px; margin: auto; }
        .hidden { display: none !important; }
        
        /* Header */
        .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .logo-img { width: 30px; height: 30px; object-fit: contain; }
        h1 { font-size: 1rem; margin: 0; }
        .btn-main { width: 100%; background: var(--team-green); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }

        /* Setup Cards */
        .setup-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; position: relative; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .item-btn { background: #2a2a2a; border: 1px solid #444; padding: 12px; border-radius: 8px; color: white; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .item-btn.selected { border-color: var(--team-green); background: #1b3a21; }
        .badge { background: var(--team-green); padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        
        /* Divisori Squadre */
        .team-separator { border-top: 3px solid var(--team-green); margin: 30px 0 15px 0; padding-top: 10px; }
        .team-separator.opponent { border-top-color: var(--red); }
        .section-label { font-size: 0.8rem; color: var(--team-green); font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .opponent .section-label { color: var(--red); }

        /* Match View */
        .team-totals { background: var(--team-green); display: flex; justify-content: space-around; padding: 10px; border-radius: 12px; margin-bottom: 10px; }
        .total-val { display: block; font-size: 1.4rem; font-weight: bold; font-family: 'Courier New', monospace; text-align: center; }
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .player-btn { background: var(--card); border: 1px solid #333; border-radius: 10px; padding: 0; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Cornici Falli */
        .foul-warning { border: 2px solid var(--yellow) !important; }
        .foul-danger { border: 2px solid var(--red) !important; }

        .p-header-row { display: flex; align-items: center; padding: 5px; border-bottom: 1px solid #333; gap: 10px; }
        .p-num-box { background: var(--team-green) !important; color: white !important; font-weight: bold; padding: 2px 8px; border-radius: 4px; font-size: 0.9rem; min-width: 25px; text-align: center; }
        .p-body-row { display: grid; grid-template-columns: 1fr 1fr; text-align: center; padding: 8px 0; }
        .p-stat-col:first-child { border-right: 1px solid #333; }
        .p-main-val { font-size: 1.8rem; font-weight: bold; font-family: 'Courier New', monospace; line-height: 1; }
        .p-sub-label { font-size: 0.6rem; color: #777; font-weight: bold; margin-top: 2px; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-bg); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; border-radius: 20px; padding: 20px; border: 1px solid #444; }
        .btn-ok { background: var(--team-green); width: 100%; margin-top: 15px; padding: 15px; font-size: 1.1rem; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <img src="logo%20Reggello.png" alt="Logo" class="logo-img" onerror="this.style.opacity='0'">
        <h1 id="headerTitle">Basket Reggello Stats</h1>
    </div>

    <div id="setupScreen">
        <button class="btn-main" onclick="openAnagrafica()" style="background:#444;">⚙️ GESTISCI ANAGRAFICA GIOCATORI</button>
        <div style="margin: 20px 0; border-bottom: 1px solid #333;"></div>
        <button class="btn-main" onclick="startSelectionProcess()">🆕 NUOVA PARTITA</button>
        <div class="section-label" style="margin-top:20px">Partite Precedenti</div>
        <div id="historyList"></div>
    </div>

    <div id="selectionScreen" class="hidden">
        <div class="setup-card">
            <input type="text" id="matchTitleInput" placeholder="Titolo Partita (es. Reggello vs Firenze)">
            <div class="section-label">CONVOCATI (Pronti)</div>
            <div id="convocatiGrid" class="grid-2"></div>
            <div class="section-label">LISTA ANAGRAFICA (Clicca per aggiungere)</div>
            <div id="disponibiliGrid" class="grid-2"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-main" onclick="location.reload()" style="background:#444">Annulla</button>
                <button class="btn-main" onclick="confirmStartMatch()">SALVA E INIZIA</button>
            </div>
        </div>
    </div>

    <div id="matchScreen" class="hidden">
        <div class="team-totals">
            <div class="total-box">
                <span style="font-size:0.6rem;">PUNTI REGGELLO</span>
                <span id="teamTotalPoints" class="total-val">0</span>
            </div>
            <div class="total-box" style="border-left: 1px solid rgba(255,255,255,0.2); padding-left: 20px;">
                <span style="font-size:0.6rem;">FALLI SQUADRA</span>
                <span id="teamTotalFouls" class="total-val">0</span>
            </div>
        </div>

        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
            <div style="display:flex; align-items:center; gap:10px;">
                <h2 id="currentTitle" style="margin:0; font-size:0.9rem; color:var(--team-green);"></h2>
                <button onclick="shareMatch()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🔗</button>
            </div>
            <button onclick="location.href=location.pathname" style="background:#333; border:none; color:white; padding:5px 10px; border-radius:5px; font-size:0.7rem;">Esci</button>
        </div>

        <div class="team-separator">
            <div class="section-label">
                <span>I MIEI GIOCATORI</span>
                <button onclick="editMatchConvocati()" style="background:none; border:none; color:var(--team-green); font-size:0.65rem; font-weight:bold;">+ MODIFICA LISTA</button>
            </div>
            <div id="playerGrid" class="player-grid"></div>
        </div>

        <div class="team-separator opponent">
            <div class="section-label">FALLI AVVERSARI</div>
            <div id="opponentGrid" class="player-grid"></div>
            <div class="setup-card" style="border:1px solid var(--red); margin-top:10px;">
                <div style="font-size:0.7rem; color:var(--red); font-weight:bold; margin-bottom:5px;">REGISTRA FALLO AVVERSARIO</div>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="newOppNum" placeholder="N° Maglia" style="margin:0;">
                    <button onclick="addNewOpponentLive()" style="background:var(--red); border:none; color:white; border-radius:8px; padding:0 20px; font-weight:bold;">OK</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="anagraficaModal" class="modal hidden">
    <div class="modal-content">
        <h3>Gestione Giocatori</h3>
        <input type="text" id="anagraficaInput" placeholder="Nome Giocatore">
        <button class="btn-main" onclick="saveToAnagrafica()">Aggiungi</button>
        <div id="anagraficaList" style="margin-top:15px; max-height:200px; overflow-y:auto;"></div>
        <button class="btn-ok" onclick="closeAnagrafica()">Chiudi</button>
    </div>
</div>

<div id="numberModal" class="modal hidden">
    <div class="modal-content">
        <h3 id="numModalTitle"></h3>
        <input type="number" id="shirtNumberInput" placeholder="Numero Maglia">
        <button class="btn-ok" onclick="applyShirtNumber()">Conferma</button>
        <button class="btn-main" id="removeBtn" style="background:#661111; margin-top:10px;" onclick="removeFromConvocati()">Rimuovi</button>
    </div>
</div>

<div id="statModal" class="modal hidden">
    <div class="modal-content">
        <h2 id="mPlayerHeader" style="text-align:center; color:var(--team-green); margin:0"></h2>
        <div style="display:flex; justify-content: space-around; margin:15px 0;">
            <div style="text-align:center"><small>PUNTI</small><div id="mPoints" style="font-size:1.5rem; font-weight:bold">0</div></div>
            <div style="text-align:center"><small>FALLI</small><div id="mFouls" style="font-size:1.5rem; font-weight:bold">0</div></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
            <button class="btn-main" onclick="updateLive('points', 1)">+1</button>
            <button class="btn-main" onclick="updateLive('points', 2)">+2</button>
            <button class="btn-main" onclick="updateLive('points', 3)">+3</button>
            <button class="btn-main" style="grid-column: span 3; background:#444" onclick="updateLive('points', -1)">-1 PUNTO</button>
            <button class="btn-main" style="grid-column: span 2; background:var(--red)" onclick="updateLive('fouls', 1)">FALLO (+1)</button>
            <button class="btn-main" style="background:#444" onclick="updateLive('fouls', -1)">-1</button>
        </div>
        <button class="btn-ok" onclick="document.getElementById('statModal').classList.add('hidden')">CHIUDI</button>
    </div>
</div>

<div id="oppStatModal" class="modal hidden">
    <div class="modal-content">
        <h2 id="oppMHeader" style="text-align:center; color:var(--red); margin:0"></h2>
        <div style="text-align:center; margin:20px 0;">
            <small>FALLI TOTALI</small>
            <div id="oppMFouls" style="font-size:3rem; font-weight:bold">0</div>
        </div>
        <button class="btn-main" style="background:var(--red); padding:20px" onclick="updateOpponentLive(1)">+1 FALLO</button>
        <button class="btn-main" style="background:#444; margin-top:10px" onclick="updateOpponentLive(-1)">-1 FALLO</button>
        <button class="btn-ok" onclick="document.getElementById('oppStatModal').classList.add('hidden')">CHIUDI</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, orderBy, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDQmVNfLViOKFEK0U5htF37BSdUmQ6oi94",
        authDomain: "statsunder13.firebaseapp.com",
        projectId: "statsunder13",
        storageBucket: "statsunder13.firebasestorage.app",
        messagingSenderId: "233460085857",
        appId: "1:233460085857:web:132407f5c98f8064ea2620"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allPlayers = [];
    let convocati = [];
    let currentMatchId = null;
    let selectedPlayerName = "";
    let activePlayerIdx = null;
    let activeOppNum = null;
    let isEditingLive = false;

    // --- ANAGRAFICA ---
    window.openAnagrafica = async () => {
        const snap = await getDoc(doc(db, "config", "anagrafica"));
        allPlayers = snap.exists() ? snap.data().list : [];
        renderAnagrafica();
        document.getElementById('anagraficaModal').classList.remove('hidden');
    };
    function renderAnagrafica() {
        document.getElementById('anagraficaList').innerHTML = allPlayers.map(name => `
            <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333;">
                <span>${name}</span>
                <button onclick="deleteFromAnagrafica('${name}')" style="background:none; border:none; color:var(--red)">🗑️</button>
            </div>`).join('');
    }
    window.saveToAnagrafica = async () => {
        const input = document.getElementById('anagraficaInput');
        if(!input.value.trim()) return;
        allPlayers.push(input.value.trim());
        await setDoc(doc(db, "config", "anagrafica"), { list: allPlayers });
        input.value = ""; renderAnagrafica();
    };
    window.deleteFromAnagrafica = async (name) => {
        allPlayers = allPlayers.filter(p => p !== name);
        await setDoc(doc(db, "config", "anagrafica"), { list: allPlayers });
        renderAnagrafica();
    };
    window.closeAnagrafica = () => document.getElementById('anagraficaModal').classList.add('hidden');

    // --- SELEZIONE CONVOCATI ---
    window.startSelectionProcess = async () => {
        isEditingLive = false;
        const snap = await getDoc(doc(db, "config", "anagrafica"));
        allPlayers = snap.exists() ? snap.data().list : [];
        convocati = [];
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('selectionScreen').classList.remove('hidden');
        renderSelectionGrids();
    };

    window.editMatchConvocati = async () => {
        isEditingLive = true;
        const snapMatch = await getDoc(doc(db, "matches", currentMatchId));
        convocati = snapMatch.data().players;
        document.getElementById('matchScreen').classList.add('hidden');
        document.getElementById('selectionScreen').classList.remove('hidden');
        document.getElementById('matchTitleInput').classList.add('hidden');
        renderSelectionGrids();
    };

    function renderSelectionGrids() {
        const disponibili = allPlayers.filter(p => !convocati.find(c => c.name === p));
        document.getElementById('disponibiliGrid').innerHTML = disponibili.map(name => `<div class="item-btn" onclick="openNumberModal('${name}')">${name} <span>+</span></div>`).join('');
        document.getElementById('convocatiGrid').innerHTML = convocati.map(c => `<div class="item-btn selected" onclick="openNumberModal('${c.name}', ${c.num})"><span class="badge">${c.num}</span> ${c.name}</div>`).join('');
    }

    window.openNumberModal = (name, existingNum = "") => {
        selectedPlayerName = name;
        document.getElementById('numModalTitle').innerText = name;
        document.getElementById('shirtNumberInput').value = existingNum;
        document.getElementById('numberModal').classList.remove('hidden');
    };

    window.applyShirtNumber = () => {
        const num = parseInt(document.getElementById('shirtNumberInput').value);
        if(isNaN(num)) return;
        const idx = convocati.findIndex(c => c.name === selectedPlayerName);
        if(idx >= 0) convocati[idx].num = num;
        else convocati.push({ name: selectedPlayerName, num, points:0, fouls:0 });
        document.getElementById('numberModal').classList.add('hidden');
        renderSelectionGrids();
    };

    window.removeFromConvocati = () => {
        convocati = convocati.filter(c => c.name !== selectedPlayerName);
        document.getElementById('numberModal').classList.add('hidden');
        renderSelectionGrids();
    };

    window.confirmStartMatch = async () => {
        if(isEditingLive) {
            await updateDoc(doc(db, "matches", currentMatchId), { players: convocati });
            location.reload();
        } else {
            const title = document.getElementById('matchTitleInput').value || "Partita";
            const docRef = await addDoc(collection(db, "matches"), {
                title, players: convocati, opponentFouls: [], createdAt: Date.now()
            });
            location.search = `?match=${docRef.id}`;
        }
    };

    // --- LOGICA PARTITA ---
    window.openPlayerModal = (originalIdx, p) => {
        if(window.location.search.includes('view')) return;
        activePlayerIdx = originalIdx;
        document.getElementById('mPlayerHeader').innerText = `#${p.num} ${p.name}`;
        document.getElementById('mPoints').innerText = p.points;
        document.getElementById('mFouls').innerText = p.fouls;
        document.getElementById('statModal').classList.remove('hidden');
    };

    window.updateLive = async (field, val) => {
        const matchRef = doc(db, "matches", currentMatchId);
        const d = await getDoc(matchRef);
        let players = [...d.data().players];
        players[activePlayerIdx][field] = Math.max(0, players[activePlayerIdx][field] + val);
        await updateDoc(matchRef, { players });
        document.getElementById('mPoints').innerText = players[activePlayerIdx].points;
        document.getElementById('mFouls').innerText = players[activePlayerIdx].fouls;
    };

    window.openOpponentModal = (num, fouls) => {
        if(window.location.search.includes('view')) return;
        activeOppNum = num;
        document.getElementById('oppMHeader').innerText = `AVVERSARIO #${num}`;
        document.getElementById('oppMFouls').innerText = fouls;
        document.getElementById('oppStatModal').classList.remove('hidden');
    };

    window.updateOpponentLive = async (val) => {
        const matchRef = doc(db, "matches", currentMatchId);
        const d = await getDoc(matchRef);
        let opps = [...(d.data().opponentFouls || [])];
        const idx = opps.findIndex(o => o.num === activeOppNum);
        if (idx >= 0) {
            opps[idx].fouls = Math.max(0, opps[idx].fouls + val);
            if(opps[idx].fouls === 0) opps.splice(idx, 1);
            await updateDoc(matchRef, { opponentFouls: opps });
            if(opps[idx]) document.getElementById('oppMFouls').innerText = opps[idx].fouls;
            else document.getElementById('oppStatModal').classList.add('hidden');
        }
    };

    window.addNewOpponentLive = async () => {
        const numInput = document.getElementById('newOppNum');
        const num = parseInt(numInput.value);
        if(isNaN(num)) return;
        const matchRef = doc(db, "matches", currentMatchId);
        const d = await getDoc(matchRef);
        let opps = [...(d.data().opponentFouls || [])];
        const idx = opps.findIndex(o => o.num === num);
        if (idx >= 0) opps[idx].fouls += 1; else opps.push({ num, fouls: 1 });
        await updateDoc(matchRef, { opponentFouls: opps });
        numInput.value = "";
    };

    window.shareMatch = () => {
        const url = `${window.location.origin}${window.location.pathname}?view=${currentMatchId}`;
        alert("Link Spettatore copiato: " + url);
    };

    // --- INIT ---
    const urlParams = new URLSearchParams(window.location.search);
    const mId = urlParams.get('match') || urlParams.get('view');

    if(mId) {
        currentMatchId = mId;
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('matchScreen').classList.remove('hidden');
        onSnapshot(doc(db, "matches", mId), (d) => {
            const data = d.data();
            document.getElementById('currentTitle').innerText = data.title;
            
            // Render Reggello ordinati
            const sortedReggello = data.players.map((p, i) => ({...p, originalIdx: i})).sort((a,b) => a.num - b.num);
            document.getElementById('teamTotalPoints').innerText = data.players.reduce((s,p)=>s+p.points, 0);
            document.getElementById('teamTotalFouls').innerText = data.players.reduce((s,p)=>s+p.fouls, 0);

            document.getElementById('playerGrid').innerHTML = sortedReggello.map(p => {
                let status = p.fouls >= 5 ? 'foul-danger' : (p.fouls === 4 ? 'foul-warning' : '');
                let fColor = p.fouls >= 5 ? 'var(--red)' : (p.fouls === 4 ? 'var(--yellow)' : 'white');
                return `
                <div class="player-btn ${status}" onclick="openPlayerModal(${p.originalIdx}, ${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <div class="p-header-row"><div class="p-num-box">${p.num}</div><div class="p-name-label">${p.name}</div></div>
                    <div class="p-body-row">
                        <div class="p-stat-col"><span class="p-main-val">${p.points}</span><br><small>PUNTI</small></div>
                        <div class="p-stat-col"><span class="p-main-val" style="color:${fColor}">${p.fouls}</span><br><small>FALLI</small></div>
                    </div>
                </div>`;
            }).join('');

            // Render Avversari ordinati
            const sortedOpps = [...(data.opponentFouls || [])].sort((a,b) => a.num - b.num);
            document.getElementById('opponentGrid').innerHTML = sortedOpps.map(o => {
                let status = o.fouls >= 5 ? 'foul-danger' : (o.fouls === 4 ? 'foul-warning' : '');
                let fColor = o.fouls >= 5 ? 'var(--red)' : (o.fouls === 4 ? 'var(--yellow)' : 'white');
                return `
                <div class="player-btn ${status}" onclick="openOpponentModal(${o.num}, ${o.fouls})">
                    <div class="p-header-row" style="background:#333"><div class="p-num-box" style="background:#555">#${o.num}</div><div class="p-name-label">AVVERSARIO</div></div>
                    <div class="p-body-row" style="grid-template-columns:1fr">
                        <div><span class="p-main-val" style="color:${fColor}">${o.fouls}</span><br><small>FALLI</small></div>
                    </div>
                </div>`;
            }).join('');
        });
    } else {
        onSnapshot(query(collection(db, "matches"), orderBy("createdAt", "desc")), (snap) => {
            document.getElementById('historyList').innerHTML = snap.docs.map(d => `
                <div class="setup-card" style="display:flex; justify-content:space-between; align-items:center">
                    <div onclick="location.search='?match=${d.id}'" style="cursor:pointer">
                        <b>${d.data().title}</b><br><small>${new Date(d.data().createdAt).toLocaleDateString()}</small>
                    </div>
                    <button onclick="deleteMatch('${d.id}')" style="background:none; border:none; color:var(--red); font-size:1.2rem;">🗑️</button>
                </div>`).join('');
        });
    }

    window.deleteMatch = async (id) => {
        if(confirm("Eliminare questa partita?")) await deleteDoc(doc(db, "matches", id));
    };
</script>
</body>
</html>
